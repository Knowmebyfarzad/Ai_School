services:
  db:
    image: postgres:18.6-alpine
    restart: always
    environment:
      POSTGRES_USER: courseuser
      POSTGRES_PASSWORD: coursepass
      POSTGRES_DB: coursedb
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://courseuser:coursepass@db:5432/coursedb?schema=public"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "dev-secret-change-me"
      STRIPE_SECRET_KEY: "sk_test_yourkey"
      STRIPE_WEBHOOK_SECRET: "whsec_yourkey"
      SIGNING_SECRET: "random-secret-32-chars"
      JWT_SECRET: "jwt-secret-change-me"
    ports:
      - "3000:3000"

volumes:
  pgdata: